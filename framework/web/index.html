<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>GANSS GS3104T PRO 键盘驱动</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1a1d21;--muted:#6b7280;--accent:#ff6a00;--line:#e5e7eb;
  --ok:#16a34a;--err:#dc2626;--modified:#2563eb}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'PingFang SC',sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;gap:12px;align-items:center}
.logo{font-weight:800;font-size:20px;letter-spacing:2px}
.badge{font-size:11px;background:#f3f4f6;border-radius:999px;padding:2px 10px;color:var(--muted)}
.badge.warn{background:#fef3c7;color:#92400e}
main{max-width:1280px;margin:20px auto;padding:0 24px;display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
h2{font-size:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button:disabled{opacity:.5;cursor:not-allowed}
.layer-switch{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.layer-switch button{border:none;border-radius:0;padding:6px 16px}
.layer-switch button.active{background:var(--accent);color:#fff}
#kb{position:relative;margin:10px auto}
#kb svg{display:block}
.keyrect{fill:#fff;stroke:#9ca3af;stroke-width:1;cursor:pointer}
.keyrect:hover{fill:#fff7f2}
.keyrect.selected{stroke:var(--accent);stroke-width:2.5}
.keyrect.modified{stroke:var(--modified);stroke-width:2}
.keyrect.reserved{fill:#f3f4f6;stroke-dasharray:3 2}
.keylabel{font-size:9px;fill:#374151;pointer-events:none;user-select:none}
.keymap-badge{font-size:8px;fill:var(--modified);pointer-events:none;font-weight:700}
.panel label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.panel select,.panel input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13px}
.mods{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.mods label{display:flex;gap:4px;align-items:center;font-size:11px;margin:0;color:var(--ink)}
#status{font-size:13px;padding:10px;border-radius:8px;margin-top:12px;display:none;white-space:pre-wrap}
#status.ok{display:block;background:#f0fdf4;color:var(--ok)}
#status.err{display:block;background:#fef2f2;color:var(--err)}
#status.info{display:block;background:#eff6ff;color:#2563eb}
.profile-item{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:13px}
.profile-item.active{border-color:var(--accent);background:#fff7f2}
.macro-ev{display:flex;gap:6px;margin-bottom:4px;font-size:11px;align-items:center}
.macro-ev input{width:70px;padding:3px 6px}
.device-info{font-size:12px;color:var(--muted);margin:6px 0}
textarea{width:100%;height:70px;font:12px ui-monospace,monospace;border:1px solid var(--line);border-radius:8px;padding:6px}
.hidden{display:none}
</style>
</head>
<body>
<header>
  <span class="logo">GANS<span style="color:var(--accent)">S</span></span><span>GS3104T PRO 驱动</span>
  <span class="badge warn">⚠ 映射生效需按 Fn+Tab 开启驱动自定义</span>
  <span style="flex:1"></span>
  <span id="devInfo" class="badge"></span>
</header>
<main>
  <section class="card">
    <h2>
      <div class="layer-switch">
        <button id="layerNormal" class="active" onclick="setLayer('normal')">普通层</button>
        <button id="layerFn" onclick="setLayer('fn')">Fn 层</button>
      </div>
      <span class="badge" id="modifiedCount"></span>
    </h2>
    <div id="kb"></div>
  </section>
  <aside>
    <div class="card panel">
      <h2>键位配置 <span class="badge" id="selKeyName">未选择</span></h2>
      <label>映射类型</label>
      <select id="mapType" onchange="renderTypeUI()">
        <option value="default">默认（恢复出厂）</option>
        <option value="key">按键 / 组合键</option>
        <option value="media">多媒体键</option>
        <option value="macro">宏</option>
      </select>
      <div id="uiKey">
        <label>组合键（如 LCtrl+C，单键直接填 usage 0x04 等）</label>
        <input id="comboKey" placeholder="LCtrl+C" list="usageList">
        <div class="mods" id="modifierBoxes"></div>
      </div>
      <div id="uiMedia" class="hidden">
        <label>多媒体键</label>
        <select id="mediaKey"></select>
      </div>
      <div id="uiMacro" class="hidden">
        <label>宏绑定槽位</label>
        <input id="macroSlot" type="number" min="0" max="99" value="0">
        <label>宏动作（按下/抬起 + 延迟ms）</label>
        <div id="macroEvents"></div>
        <button onclick="addMacroEvent()">+ 添加事件</button>
        <label style="margin-top:8px">说明：actionType=3（键盘），下发走官方新协议（实验性）</label>
      </div>
      <div style="display:flex;gap:8px;margin-top:14px">
        <button class="primary" onclick="applyMap()">下发映射</button>
        <button onclick="applyDefault()">恢复默认</button>
      </div>
    </div>
    <div class="card" style="margin-top:16px">
      <h2>配置文件</h2>
      <div id="profiles"></div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <input id="profileName" placeholder="新配置名" style="flex:1">
        <button onclick="saveProfile()">保存当前</button>
      </div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button onclick="exportProfiles()">导出 JSON</button>
        <label style="flex:1;position:relative;overflow:hidden">
          <input type="file" id="importFile" accept=".json" style="position:absolute;inset:0;opacity:0;cursor:pointer" onchange="importProfiles(event)">
          <button style="width:100%">导入 JSON</button>
        </label>
      </div>
    </div>
    <div class="card" style="margin-top:16px">
      <h2>设备状态</h2>
      <div id="stateInfo" class="device-info">—</div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="primary" style="flex:1" onclick="lighting()">测试灯光（静态·橙色）</button>
      </div>
    </div>
  </aside>
</main>
<div style="max-width:1280px;margin:0 auto;padding:0 24px 30px">
  <div id="status"></div>
</div>
<datalist id="usageList"></datalist>
<script>
const $=i=>document.getElementById(i);
let devices=[],selected=null,layer='normal',keys=[],modified={normal:{},fn:{}},curKey=null,mediaKeys=[];

function status(k,t){const s=$('status');s.className=k;s.textContent=t}
async function api(m,p={}){const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({api_version:2,id:String(Date.now()),method:m,params:p})});return r.json()}

// ---- init ----
(async()=>{
  const r=await api('devices.scan');
  if(r.ok&&r.result.devices.length){devices=r.result.devices;selected=0;
    $('devInfo').textContent=devices[0].name+' · '+devices[0].connection;
    await loadState();
  } else $('devInfo').textContent='未发现键盘';
  const k=await api('keys.list',{device:devices[0]?.device_id||''});
  if(k.ok){keys=k.result.keys;mediaKeys=k.result.media_keys||[];
    $('mediaKey').innerHTML=mediaKeys.map(m=>`<option value="${m.id}">${m.name}</option>`).join('');
    buildCanvas();buildUsageList();buildModifiers();
  }
  await refreshProfiles();
})();

async function loadState(){
  const r=await api('device.state',{device:devices[0].device_id});
  if(r.ok){
    const st=r.result.state;
    if(st.shadow){modified=st.shadow.keymap||{normal:{},fn:{}}}
    $('stateInfo').innerHTML=
      `连接: ${st.connection}<br>硬件回读: ${st.readback==='hardware'?'✅ 支持（新固件）':'❌ 不支持（旧固件/休眠）'}`+
      (st.battery!=null?`<br>电量: ${st.battery}%`:'')+
      (st.web_protocol===false?'<br>⚠ 媒体键/宏需新固件':'');
  }
}

// ---- keyboard canvas ----
function buildCanvas(){
  if(!keys.length)return;
  const maxX=Math.max(...keys.map(k=>k.rect[0]+k.rect[2]));
  const maxY=Math.max(...keys.map(k=>k.rect[1]+k.rect[3]));
  const scale=1.9, W=(maxX+10)*scale, H=(maxY+10)*scale;
  let svg=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  for(const k of keys){
    const[x,y,w,h]=k.rect;
    const isFn=k.name==='Fn', isTab=k.name==='Tab';
    svg+=`<g data-idx="${k.index}">
      <rect class="keyrect" data-idx="${k.index}" x="${(x+5)*scale}" y="${(y+5)*scale}" width="${w*scale}" height="${h*scale}" rx="4"/>
      <text class="keylabel" x="${(x+5)*scale+w*scale/2}" y="${(y+5)*scale+h*scale/2+3}" text-anchor="middle">${k.name}</text>
      <text class="keymap-badge" data-badge="${k.index}" x="${(x+5)*scale+w*scale-2}" y="${(y+5)*scale+10}" text-anchor="end"></text>
    </g>`;
  }
  svg+='</svg>';
  $('kb').innerHTML=svg;
  $('kb').addEventListener('click',e=>{
    const r=e.target.closest('.keyrect');if(!r)return;
    selectKey(+r.dataset.idx);
  });
  refreshBadges();
}
function keyByIndex(i){return keys.find(k=>k.index===i)}
function selectKey(i){
  curKey=i;
  document.querySelectorAll('.keyrect').forEach(r=>r.classList.toggle('selected',+r.dataset.idx===i));
  const k=keyByIndex(i);
  $('selKeyName').textContent=`${k.name} (#${i})`;
  const isFnKey=k.name==='Fn';
  if(isFnKey){status('info','Fn 为系统保留键，禁止修改（防自锁保护）')}
  const cur=modified[layer][k.name];
  renderTypeUI();
  if(cur){
    if(cur.startsWith('media:')){$('mapType').value='media';$('mediaKey').value=cur}
    else if(cur.startsWith('macro:')){$('mapType').value='macro';$('macroSlot').value=cur.slice(6)}
    else if(cur!=='default'){$('mapType').value='key';$('comboKey').value=cur}
    else $('mapType').value='default';
  } else $('mapType').value='default';
}
function setLayer(l){layer=l;
  $('layerNormal').classList.toggle('active',l==='normal');
  $('layerFn').classList.toggle('active',l==='fn');
  refreshBadges();
}
function refreshBadges(){
  const m=modified[layer]||{};let n=0;
  document.querySelectorAll('.keyrect').forEach(r=>{
    const k=keyByIndex(+r.dataset.idx);
    const isMod=m[k.name]&&m[k.name]!=='default';
    r.classList.toggle('modified',!!isMod);
    r.classList.toggle('reserved',k.name==='Fn');
    if(isMod)n++;
    const badge=document.querySelector(`[data-badge="${k.index}"]`);
    if(badge)badge.textContent=isMod?(m[k.name]==='default'?'⌂':m[k.name].replace('media:','').slice(0,5)):'';
  });
  $('modifiedCount').textContent=`已改 ${n} 键`;
}
function buildUsageList(){
  const common=[['A',4],['B',5],['C',6],['V',25],['X',27],['Q',20],['W',26],['Esc',41],['Space',44],['Enter',40],['Tab',43],['0x04',4]];
  $('usageList').innerHTML=common.map(([n,u])=>`<option value="${n}">`).join('');
}
function buildModifiers(){
  const mods=['LCtrl','LShift','LAlt','LWin','RCtrl','RShift','RAlt','RWin'];
  $('modifierBoxes').innerHTML=mods.map(m=>`<label><input type="checkbox" data-mod="${m}">${m}</label>`).join('');
}
function renderTypeUI(){
  const t=$('mapType').value;
  $('uiKey').classList.toggle('hidden',t!=='key');
  $('uiMedia').classList.toggle('hidden',t!=='media');
  $('uiMacro').classList.toggle('hidden',t!=='macro');
}

// ---- mapping apply ----
function comboFromUI(){
  const mods=[...document.querySelectorAll('[data-mod]:checked')].map(c=>c.dataset.mod);
  const key=$('comboKey').value.trim();
  if(!key)return null;
  return [...mods,key].join('+');
}
async function applyMap(){
  if(curKey==null)return status('err','请先点击选择一个按键');
  const k=keyByIndex(curKey);
  if(k.name==='Fn')return status('err','Fn 为系统保留键，禁止修改');
  const t=$('mapType').value;
  let target='default';
  if(t==='key'){target=comboFromUI();if(!target)return status('err','请填写目标键')}
  if(t==='media'){target=$('mediaKey').value}
  if(t==='macro'){target=`macro:${$('macroSlot').value}`}
  const r=await api('device.apply',{device:devices[0].device_id,module:'keymap',
    patch:{source:k.name,target,layer}});
  if(r.ok){
    modified[layer][k.name]=target;
    // macro: also send macro definition if editor has events
    if(t==='macro'){
      const acts=collectMacroEvents();
      if(acts.length){
        const mr=await api('device.apply',{device:devices[0].device_id,module:'macro',
          patch:{slot:+$('macroSlot').value,actions:acts}});
        if(!mr.ok)status('err','宏定义下发失败: '+mr.error.message);
      }
    }
    refreshBadges();
    status('ok',`已下发 ${k.name} → ${target}`+(r.result.apply.note?'\n'+r.result.apply.note:''));
  } else status('err',r.error.message);
}
async function applyDefault(){
  if(curKey==null)return status('err','请先选择按键');
  const k=keyByIndex(curKey);
  if(k.name==='Fn')return status('err','Fn 为系统保留键');
  const r=await api('device.apply',{device:devices[0].device_id,module:'keymap',
    patch:{source:k.name,target:'default',layer}});
  if(r.ok){modified[layer][k.name]='default';refreshBadges();status('ok',`${k.name} 已恢复默认`)}
  else status('err',r.error.message);
}
async function lighting(){
  const r=await api('device.apply',{device:devices[0].device_id,module:'lighting',
    patch:{mode:1,color:'FF6A00',brightness:4,speed:3}});
  status(r.ok?'ok':'err',r.ok?'灯光已切换为静态橙色':'灯光失败: '+r.error.message);
}

// ---- macro editor ----
let macroEvents=[];
function addMacroEvent(ev){
  macroEvents.push(ev||{isPress:true,keyCode:4,delay_ms:20});
  renderMacroEvents();
}
function renderMacroEvents(){
  $('macroEvents').innerHTML=macroEvents.map((e,i)=>`
    <div class="macro-ev">
      <select onchange="macroEvents[${i}].isPress=this.value==='1'">
        <option value="1"${e.isPress?' selected':''}>按下</option>
        <option value="0"${!e.isPress?' selected':''}>抬起</option>
      </select>
      <input type="number" value="${e.keyCode}" title="HID usage" onchange="macroEvents[${i}].keyCode=+this.value">
      <input type="number" value="${e.delay_ms}" title="延迟 ms" onchange="macroEvents[${i}].delay_ms=+this.value">
      <button onclick="macroEvents.splice(${i},1);renderMacroEvents()">×</button>
    </div>`).join('');
}
function collectMacroEvents(){return macroEvents}

// ---- profiles ----
async function refreshProfiles(){
  const r=await api('profiles.list',{device:devices[0].device_id});
  if(r.ok){
    const ps=r.result.profiles;
    $('profiles').innerHTML=ps.length?ps.map(p=>`
      <div class="profile-item"><span>${p.name}</span>
        <span><button onclick="loadProfile('${p.name}')">载入</button>
        <button onclick="delProfile('${p.name}')">×</button></span>
      </div>`).join(''):'<span class="badge">暂无配置</span>';
  }
}
async function saveProfile(){
  const name=$('profileName').value.trim();
  if(!name)return status('err','请填写配置名');
  const r=await api('profiles.save',{device:devices[0].device_id,name,
    data:{keymap:JSON.parse(JSON.stringify(modified))}});
  if(r.ok){status('ok','配置已保存: '+name);$('profileName').value='';refreshProfiles()}
  else status('err',r.error.message);
}
async function loadProfile(name){
  const r=await api('profiles.list',{device:devices[0].device_id});
  if(!r.ok)return status('err',r.error.message);
  const p=r.result.profiles.find(x=>x.name===name);
  if(!p)return;
  modified={normal:{...(p.keymap.normal||{})},fn:{...(p.keymap.fn||{})}};
  refreshBadges();
  status('ok',`已载入配置「${name}」（映射表已同步到界面；逐键下发请点击各键）`);
}
async function delProfile(name){
  await api('profiles.delete',{device:devices[0].device_id,name});
  refreshProfiles();
}
async function exportProfiles(){
  const r=await api('profiles.export',{device:devices[0].device_id});
  if(r.ok){
    const blob=new Blob([JSON.stringify(r.result.export,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='ganss-profiles.json';a.click();
  }
}
async function importProfiles(ev){
  const f=ev.target.files[0];if(!f)return;
  const text=await f.text();
  const r=await api('profiles.import',{device:devices[0].device_id,data:JSON.parse(text)});
  if(r.ok){status('ok',`已导入 ${r.result.result.imported} 个配置`);refreshProfiles()}
  else status('err',r.error.message);
}
</script>
</body>
</html>
