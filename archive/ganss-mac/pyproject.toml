[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ganss-gs3104t-mac"
version = "0.1.0"
description = "Local web driver for GANSS GS3104T PRO on macOS"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["ganss*"]

[tool.setuptools.package-data]
ganss = ["data/*.json", "data/*.png"]
