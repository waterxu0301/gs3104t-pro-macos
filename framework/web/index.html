<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>GANSS 驱动框架 (阶段1)</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1a1d21;--muted:#6b7280;--accent:#ff6a00;--line:#e5e7eb;--ok:#16a34a;--err:#dc2626}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'PingFang SC',sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;gap:12px;align-items:center}
.logo{font-weight:800;font-size:20px;letter-spacing:2px}
main{max-width:1000px;margin:24px auto;padding:0 24px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
h2{font-size:15px;margin-bottom:12px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 14px}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.badge{font-size:11px;background:#f3f4f6;border-radius:999px;padding:2px 10px;color:var(--muted)}
.device,.plugin{padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;font-size:13px}
.meta{color:var(--muted);font-size:11px;margin-top:4px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
select,input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;font:inherit}
#status{font-size:13px;padding:10px;border-radius:8px;margin-top:12px;display:none;white-space:pre-wrap}
#status.ok{display:block;background:#f0fdf4;color:var(--ok)}
#status.err{display:block;background:#fef2f2;color:var(--err)}
#status.info{display:block;background:#eff6ff;color:#2563eb}
.row{display:flex;gap:10px}
</style>
</head>
<body>
<header>
  <span class="logo">GANS<span style="color:var(--accent)">S</span></span><span>驱动框架</span>
  <span class="badge">阶段1 · 插件化</span><span style="flex:1"></span>
  <span class="badge">127.0.0.1 · 本地运行</span>
</header>
<main>
  <section class="card">
    <h2>设备 <button class="primary" onclick="scan()">刷新扫描</button></h2>
    <div id="devices"></div>
    <h2 style="margin-top:18px">已加载插件</h2>
    <div id="plugins"></div>
  </section>
  <section class="card">
    <h2>灯光控制</h2>
    <label>模式</label>
    <select id="mode"></select>
    <div class="row">
      <div><label>亮度</label><input type="number" id="brightness" min="0" max="5" value="4"></div>
      <div><label>速度</label><input type="number" id="speed" min="0" max="5" value="3"></div>
      <div><label>颜色</label><input type="color" id="color" value="#ff6a00" style="height:34px;padding:2px"></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:14px">
      <button class="primary" onclick="applyLight()">应用灯光</button>
      <button onclick="lightOff()">关闭背光</button>
    </div>
    <h2 style="margin-top:18px">按键映射 (2.4G)</h2>
    <div class="row">
      <div><label>来源键</label><input id="src" value="Q" list="keys"></div>
      <div><label>目标</label><input id="dst" value="Q" list="keys"></div>
    </div>
    <label>层</label>
    <select id="layer"><option value="normal">普通层</option><option value="fn">Fn 层</option></select>
    <div style="margin-top:12px"><button class="primary" onclick="applyMap()">下发映射</button></div>
    <div id="status"></div>
    <p class="meta" style="margin-top:12px">⚠️ 映射生效前需按 <b>Fn+Tab</b> 开启驱动自定义按键模式。写入成功=硬件ACK确认；请实际验证效果。</p>
  </section>
</main>
<script>
const $=i=>document.getElementById(i);
let devices=[],selected=null;
const MODES=[[0,'关闭'],[1,'静态恒亮'],[2,'单点亮'],[3,'单熄灭'],[4,'繁星点点'],[5,'漫天飞雪'],[6,'百花争艳'],[7,'动态呼吸'],[8,'光谱循环'],[9,'彩泉涌动'],[10,'多彩纵横'],[11,'随波逐流'],[12,'峰回路转'],[13,'一触即发'],[14,'一石二鸟'],[15,'涟漪扩散'],[16,'川流不息'],[17,'重峦叠嶂'],[18,'斜风细雨'],[19,'来回穿梭']];
$('mode').innerHTML=MODES.map(([n,nm])=>`<option value="${n}"${n===11?' selected':''}>${n} ${nm}</option>`).join('');
function status(kind,text){const s=$('status');s.className=kind;s.textContent=text}
async function api(m,p={}){const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({api_version:2,id:String(Date.now()),method:m,params:p})});return r.json()}
async function scan(){
  status('info','扫描中…');
  const r=await api('devices.scan');if(!r.ok)return status('err',r.error.message);
  devices=r.result.devices;
  $('devices').innerHTML=devices.length?devices.map((d,i)=>`<div class="device" data-i="${i}" onclick="sel(${i})" style="${selected===i?'border-color:var(--accent);background:#fff7f2':''}"><b>${d.name}</b> <span class="badge">${d.device_type}</span><div class="meta">${d.device_id} · ${d.connection} · ${d.plugin_id}</div></div>`).join(''):'<div class="meta">未发现设备</div>';
  const p=await api('plugins.list');
  $('plugins').innerHTML=p.result.plugins.map(pl=>`<div class="plugin"><b>${pl.name}</b> <span class="badge">${pl.plugin_id} v${pl.version}</span><div class="meta">能力: ${pl.capabilities.join(', ')} · ${pl.enabled?'已启用':'已禁用'}</div><div style="margin-top:6px"><button onclick="togglePlugin('${pl.plugin_id}',${!pl.enabled})">${pl.enabled?'禁用':'启用'}</button></div></div>`).join('');
  status(devices.length?'ok':'err',devices.length?`发现 ${devices.length} 台设备`:'未发现设备');
}
function sel(i){selected=i;scan()}
async function togglePlugin(id,en){await api('plugins.set_enabled',{plugin_id:id,enabled:en});scan()}
async function needDev(){if(selected==null||!devices[selected]){status('err','请先扫描并选择设备');return null}return devices[selected].device_id}
async function applyLight(){const d=await needDev();if(!d)return;
  const r=await api('device.apply',{device:d,module:'lighting',patch:{mode:+$('mode').value,color:$('color').value.slice(1).toUpperCase(),brightness:+$('brightness').value,speed:+$('speed').value}});
  status(r.ok?'ok':'err',r.ok?'灯光指令已发送（硬件ACK通过），请目视确认效果':r.error.message)}
async function lightOff(){const d=await needDev();if(!d)return;
  const r=await api('device.apply',{device:d,module:'lighting',patch:{mode:0}});
  status(r.ok?'ok':'err',r.ok?'背光已关闭':r.error.message)}
async function applyMap(){const d=await needDev();if(!d)return;
  const r=await api('device.apply',{device:d,module:'keymap',patch:{source:$('src').value.trim(),target:$('dst').value.trim(),layer:$('layer').value}});
  status(r.ok?'ok':'err',r.ok?`映射 ${$('src').value}→${$('dst').value} 已发送（ACK通过），请按键验证`:r.error.message)}
scan();
</script>
</body>
</html>
