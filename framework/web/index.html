<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>GANSS Device Hub</title>
<style>
:root{
  --g-surface:#FFFFFF;--g-bg:#F8F9FA;--g-line:#DADCE0;--g-line2:#E8EAED;
  --g-ink:#202124;--g-sub:#5F6368;--g-disabled:#9AA0A6;
  --g-blue:#1A73E8;--g-blue-hover:#1557B0;--g-blue-bg:#E8F0FE;--g-blue-ink:#1967D2;
  --g-green:#1E8E3E;--g-green-bg:#E6F4EA;
  --g-amber:#B06000;--g-amber-bg:#FEF7E0;
  --g-gray:#5F6368;--g-gray-bg:#F1F3F4;
  --g-red:#C5221F;--g-red-bg:#FCE8E6;
  --shadow-pop:0 1px 3px rgba(60,64,67,.15);
  --mono:'Roboto Mono','JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Google Sans','Inter','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--g-bg);color:var(--g-ink);font-size:14px}
/* ---- Top App Bar ---- */
.appbar{height:64px;background:var(--g-surface);border-bottom:1px solid var(--g-line2);
  display:flex;align-items:center;gap:16px;padding:0 24px;position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px}
.brand svg{color:var(--g-blue)}
.devbar{display:flex;gap:8px;margin-left:8px}
.devtab{display:flex;align-items:center;gap:10px;padding:8px 16px;border-radius:9999px;
  border:1px solid transparent;cursor:pointer;font-size:13px;color:var(--g-sub)}
.devtab:hover{background:var(--g-gray-bg)}
.devtab.active{background:var(--g-blue-bg);color:var(--g-blue-ink);border-color:var(--g-blue)}
.devtab svg{width:20px;height:20px}
.conn-chip{font-size:11px;padding:1px 8px;border-radius:9999px;background:var(--g-gray-bg);color:var(--g-gray)}
.status-dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot-ok{background:var(--g-green)}
.dot-sleep{background:var(--g-amber)}
.dot-ro{background:var(--g-gray)}
.dot-err{background:var(--g-red)}
.batt{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--g-sub)}
.batt-bar{width:22px;height:10px;border:1px solid var(--g-sub);border-radius:2px;position:relative;overflow:hidden}
.batt-fill{position:absolute;inset:1px auto 1px 1px;background:var(--g-green);border-radius:1px}
.appbar .spacer{flex:1}
.iconbtn{width:40px;height:40px;border-radius:50%;border:none;background:transparent;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:var(--g-sub)}
.iconbtn:hover{background:var(--g-gray-bg)}
.iconbtn svg{width:22px;height:22px}
/* ---- layout ---- */
main{max-width:1320px;margin:20px auto;padding:0 24px}
.card{background:var(--g-surface);border:1px solid var(--g-line);border-radius:12px;padding:20px;margin-bottom:16px}
.card h2{font-size:15px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h2 svg{width:20px;height:20px;color:var(--g-sub)}
.grid2{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
/* ---- segmented button ---- */
.seg{display:inline-flex;border:1px solid var(--g-line);border-radius:9999px;overflow:hidden}
.seg button{border:none;background:transparent;padding:7px 20px;font:inherit;font-size:13px;
  color:var(--g-sub);cursor:pointer}
.seg button.active{background:var(--g-blue-bg);color:var(--g-blue-ink);font-weight:500}
/* ---- buttons ---- */
button.m3{font:inherit;font-size:13px;padding:8px 18px;border-radius:9999px;cursor:pointer;
  border:1px solid var(--g-line);background:var(--g-surface);color:var(--g-blue)}
button.m3:hover{background:var(--g-blue-bg)}
button.m3.primary{background:var(--g-blue);color:#fff;border-color:var(--g-blue)}
button.m3.primary:hover{background:var(--g-blue-hover)}
button.m3:disabled{color:var(--g-disabled);border-color:var(--g-line2);background:var(--g-gray-bg);cursor:not-allowed}
/* ---- pills ---- */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 12px;border-radius:9999px}
.pill svg{width:14px;height:14px}
.pill.ok{background:var(--g-green-bg);color:var(--g-green)}
.pill.warn{background:var(--g-amber-bg);color:var(--g-amber)}
.pill.ro{background:var(--g-gray-bg);color:var(--g-gray)}
.pill.err{background:var(--g-red-bg);color:var(--g-red)}
/* ---- keyboard canvas ---- */
#kb{margin:12px auto 0}
.keyrect{fill:#FFF;stroke:#BDC1C6;stroke-width:1;cursor:pointer;transition:transform .08s}
.keyrect:hover{fill:#F1F6FE;transform:scale(1.04)}
.keyrect.selected{stroke:var(--g-blue);stroke-width:2.5}
.keyrect.modified{fill:var(--g-blue-bg);stroke:var(--g-blue);stroke-width:1.5}
.keyrect.reserved{fill:var(--g-gray-bg);stroke-dasharray:3 2}
.keylabel{font-size:9px;fill:var(--g-ink);pointer-events:none;user-select:none}
.keysub{font-size:7px;fill:var(--g-blue);pointer-events:none;font-weight:600}
/* ---- forms ---- */
label.f{display:block;font-size:12px;color:var(--g-sub);margin:12px 0 4px}
select.f,input.f{width:100%;padding:9px 12px;border:1px solid var(--g-line);border-radius:8px;font:inherit;font-size:13px;background:#fff}
.mods{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.mods label{display:flex;gap:5px;align-items:center;font-size:11px;color:var(--g-ink)}
.btnrow{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
/* ---- status bar ---- */
#status{font-size:13px;padding:10px 16px;border-radius:8px;margin-top:12px;display:none}
#status.ok{display:block;background:var(--g-green-bg);color:var(--g-green)}
#status.err{display:block;background:var(--g-red-bg);color:var(--g-red)}
#status.info{display:block;background:var(--g-blue-bg);color:var(--g-blue-ink)}
#status.warn{display:block;background:var(--g-amber-bg);color:var(--g-amber)}
/* ---- sleep banner ---- */
.sleepbar{display:none;align-items:center;gap:10px;background:var(--g-amber-bg);color:var(--g-amber);
  padding:10px 16px;border-radius:10px;margin-bottom:14px;font-size:13px}
.sleepbar.show{display:flex}
.sleepbar svg{width:18px;height:18px}
/* ---- profiles ---- */
.profile-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;
  border:1px solid var(--g-line);border-radius:10px;margin-bottom:6px;font-size:13px}
.profile-item:hover{background:var(--g-gray-bg)}
/* ---- mouse tabs ---- */
.tabs{display:flex;gap:4px;margin-bottom:14px}
.tabs button{border:none;background:transparent;padding:8px 20px;border-radius:9999px;font:inherit;
  font-size:13px;color:var(--g-sub);cursor:pointer}
.tabs button.active{background:var(--g-blue-bg);color:var(--g-blue-ink);font-weight:500}
.hidden{display:none}
.dpi-stage{border:1px solid var(--g-line);border-radius:10px;padding:12px;margin-bottom:8px}
.dpi-stage .row{display:flex;gap:10px;align-items:center}
.dpi-stage input[type=number]{width:90px;padding:6px 8px;border:1px solid var(--g-line);border-radius:8px}
input[type=range]{accent-color:var(--g-blue)}
.switch-row{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px}
.switch-row label{display:flex;gap:6px;font-size:13px;align-items:center;color:var(--g-ink)}
.mono{font-family:var(--mono)}
/* ---- drawers ---- */
.drawer-mask{position:fixed;inset:0;background:rgba(32,33,36,.4);display:none;z-index:90}
.drawer-mask.show{display:block}
.drawer{position:fixed;top:0;right:-420px;width:420px;height:100vh;background:var(--g-surface);
  z-index:100;transition:right .25s;box-shadow:var(--shadow-pop);padding:20px;overflow:auto}
.drawer.show{right:0}
.drawer h3{font-size:15px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
pre.mono{background:var(--g-gray-bg);padding:12px;border-radius:8px;font-size:11px;max-height:60vh;overflow:auto;font-family:var(--mono)}
/* ---- menus ---- */
.menu{position:absolute;background:var(--g-surface);border:1px solid var(--g-line);border-radius:10px;
  box-shadow:var(--shadow-pop);padding:6px 0;min-width:220px;z-index:120;display:none}
.menu.show{display:block}
.menu .mi{padding:9px 18px;font-size:13px;cursor:pointer}
.menu .mi:hover{background:var(--g-gray-bg)}
.menu .mi svg{width:16px;height:16px;vertical-align:-3px;margin-right:8px;color:var(--g-sub)}
/* mouse svg */
.mouseview{text-align:center;margin:8px 0}
.mbtn{cursor:pointer}
.mbtn.active circle{stroke:var(--g-blue);stroke-width:3}
.dpi-cfg{border:1px solid var(--g-line);border-radius:10px;padding:12px;margin-bottom:8px}
</style>
</head>
<body>

<div class="appbar">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 2 7v10l10 5 10-5V7zm0 2.2 6.8 3.4L12 11 5.2 7.6zM5 9.4l6 3v7.4l-6-3zm14 7.4-6 3v-7.4l6-3z"/></svg>
    <span>GANSS Device Hub</span>
  </div>
  <div class="devbar" id="devbar"></div>
  <div class="spacer"></div>
  <button class="iconbtn" id="btnPresets" title="配置模板库"><svg><use href="#i-layer"/></svg></button>
  <button class="iconbtn" id="btnExport" title="导出配置"><svg><use href="#i-download"/></svg></button>
  <button class="iconbtn" id="btnImport" title="导入配置"><svg><use href="#i-upload"/></svg></button>
  <button class="iconbtn" id="btnLogs" title="通信日志"><svg><use href="#i-terminal"/></svg></button>
  <button class="iconbtn" id="btnPlugins" title="插件管理"><svg><use href="#i-plugin"/></svg></button>
</div>
<main>
  <div id="sleepbar" class="sleepbar">
    <svg><use href="#i-sleep"/></svg>
    <span>设备休眠中，按任意键 / 移动鼠标唤醒后即可同步</span>
    <button class="m3" onclick="syncPending()">唤醒并同步</button>
  </div>

  <!-- keyboard workspace -->
  <section id="kbView">
    <div class="card">
      <h2><svg><use href="#i-layer"/></svg>按键映射
        <span style="flex:1"></span>
        <div class="seg" style="margin-right:10px">
          <button id="layNormal" class="active" onclick="setLayer('normal')">普通层</button>
          <button id="layFn" onclick="setLayer('fn')">Fn 层</button>
        </div>
        <button class="m3" onclick="applyFullLayer()">整层下发</button>
        <button class="m3" onclick="restoreLayer()">恢复全层默认</button>
      </h2>
      <div id="kb"></div>
    </div>
    <div class="grid2">
      <div class="card">
        <h2>选中键位 <span class="pill ro" id="selName">未选择</span></h2>
        <label class="f">映射类型</label>
        <select class="f" id="mapType" onchange="renderTypeUI()">
          <option value="default">默认（恢复出厂）</option>
          <option value="key">按键 / 组合键</option>
          <option value="media">多媒体键</option>
          <option value="disabled">禁用按键</option>
        </select>
        <div id="uiKey">
          <label class="f">目标键 / 组合键（如 LCtrl+C）</label>
          <input class="f" id="comboKey" placeholder="LCtrl+C" list="usageList">
          <div class="mods" id="modifierBoxes"></div>
        </div>
        <div id="uiMedia" class="hidden">
          <label class="f">多媒体键（Consumer Page LE）</label>
          <select class="f" id="mediaKey"></select>
        </div>
        <div class="btnrow">
          <button class="m3 primary" onclick="applyMap()">下发映射</button>
          <button class="m3" onclick="applyDefault()">恢复该键默认</button>
        </div>
        <div id="status"></div>
      </div>
      <div>
        <div class="card">
          <h2>配置文件</h2>
          <div id="profiles"></div>
          <div style="display:flex;gap:8px;margin-top:10px">
            <input class="f" id="profileName" placeholder="新配置名" style="flex:1">
            <button class="m3" onclick="saveProfile()">保存当前</button>
          </div>
        </div>
        <div class="card">
          <h2>设备状态</h2>
          <div id="kbStateInfo" style="font-size:12px;color:var(--g-sub);line-height:1.7">—</div>
        </div>
      </div>
    </div>
    <div class="card">
      <h2><svg><use href="#i-light"/></svg>灯光控制
        <span style="flex:1"></span>
        <span class="pill ro" id="lightModeDesc"></span>
      </h2>
      <div id="lightModes" style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px"></div>
      <div style="display:flex;gap:16px;margin-top:16px;flex-wrap:wrap;align-items:center">
        <label class="f" style="margin:0">颜色 <input type="color" id="lightColor" value="#1A73E8" style="width:46px;height:34px;padding:2px;vertical-align:middle"></label>
        <label class="f" style="margin:0">亮度 <input type="range" id="lightBri" min="0" max="5" value="4" oninput="lightBriV.textContent=this.value"> <b id="lightBriV">4</b></label>
        <label class="f" style="margin:0">速度 <input type="range" id="lightSpd" min="0" max="5" value="3" oninput="lightSpdV.textContent=this.value"> <b id="lightSpdV">3</b></label>
        <label class="f" style="margin:0;display:flex;gap:6px;align-items:center"><input type="checkbox" id="lightColorful"> 炫彩混光</label>
        <label class="f" style="margin:0">方向
          <select class="f" id="lightDir" style="width:auto;padding:5px 10px">
            <option value="0">默认</option><option value="1">左 → 右</option>
            <option value="2">右 → 左</option><option value="3">上 → 下</option><option value="4">下 → 上</option>
          </select></label>
        <button class="m3 primary" onclick="applyLightFull()">应用灯光</button>
        <button class="m3" onclick="lightOff()">关闭背光</button>
      </div>
    </div>
  </section>

  <!-- mouse workspace -->
  <section id="msView" class="hidden">
    <div class="sleepbar" id="msWhidHint" style="display:flex;background:var(--g-blue-bg);color:var(--g-blue-ink)">
      <svg><use href="#i-usb"/></svg>
      <span>FLX3 需要浏览器直连通道（与官方驱动同款传输层）。点击右侧按钮授权一次，授权将持久化。</span>
      <button class="m3 primary" id="btnWhidConnect" onclick="whidConnect()">授权浏览器直连</button>
      <span id="whidState"></span>
    </div>
    <div class="card">
      <div class="tabs">
        <button class="active" onclick="msTab(this,'msKeys')">按键设置</button>
        <button onclick="msTab(this,'msDpi')">DPI 设置</button>
        <button onclick="msTab(this,'msPerf')">性能设置</button>
        <button onclick="msTab(this,'msOther')">其他设置</button>
      </div>
      <div id="msKeys" class="grid2">
        <div class="card" style="margin:0">
          <h2>按键绑定 <span class="pill ro" id="msSelName">点击鼠标图选键</span></h2>
          <div class="mouseview" id="mouseSvg"></div>
          <div id="msButtonList"></div>
        </div>
        <div class="card" style="margin:0">
          <h2>动作绑定 <span class="pill ro" id="msCurBtn">—</span></h2>
          <label class="f">类型</label>
          <select class="f" id="msType" onchange="msRenderType()">
            <option value="default">默认</option>
            <option value="mouse">鼠标键</option>
            <option value="combo">键盘组合键</option>
            <option value="media">多媒体</option>
            <option value="fire">火力键</option>
            <option value="dpi">DPI 功能</option>
            <option value="disable">禁用</option>
          </select>
          <div id="msUiMouse" class="hidden"><label class="f">鼠标键</label>
            <select class="f" id="msMouseBtn"><option value="mouse:左键">左键</option><option value="mouse:右键">右键</option><option value="mouse:中键">中键</option><option value="mouse:前进">前进</option><option value="mouse:后退">后退</option></select></div>
          <div id="msUiCombo" class="hidden"><label class="f">组合键</label><input class="f" id="msCombo" placeholder="LCtrl+C"></div>
          <div id="msUiMedia" class="hidden"><label class="f">多媒体键</label><select class="f" id="msMedia"></select></div>
          <div id="msUiFire" class="hidden"><label class="f">间隔 ms / 次数（0=按住连发）</label>
            <div style="display:flex;gap:8px"><input class="f" id="msFireInt" type="number" value="50"><input class="f" id="msFireCnt" type="number" value="3"></div></div>
          <div id="msUiDpi" class="hidden"><label class="f">DPI 功能</label>
            <select class="f" id="msDpiFn"><option value="dpi_cycle">DPI 循环</option><option value="dpi_up">DPI +</option><option value="dpi_down">DPI -</option></select></div>
          <div class="btnrow"><button class="m3 primary" onclick="msApply()">下发按键</button></div>
          <div id="msStatus"></div>
        </div>
      </div>
      <div id="msDpi" class="hidden">
        <div class="card" style="margin:0">
          <h2>DPI 档位 <span class="pill ro" id="msSensorBadge">PAW3395</span></h2>
          <div id="dpiStages"></div>
          <div class="switch-row">
            <label><input type="checkbox" id="dpiXY"> X/Y 独立设置</label>
            <button class="m3 primary" onclick="msApplyDpi()">下发 DPI</button>
            <button class="m3" onclick="msApplyDpiColor()">下发档位颜色</button>
          </div>
        </div>
      </div>
      <div id="msPerf" class="hidden">
        <div class="card" style="margin:0">
          <h2>性能</h2>
          <label class="f">回报率</label>
          <div class="radio-group" id="msRateGroup" style="display:flex;gap:8px;flex-wrap:wrap"></div>
          <label class="f" style="margin-top:12px">LOD 静默高度</label>
          <div style="display:flex;gap:8px">
            <label class="pill ro"><input type="radio" name="lod" value="1" checked>1mm</label>
            <label class="pill ro"><input type="radio" name="lod" value="2">2mm</label>
          </div>
          <label class="f" style="margin-top:12px">休眠时间: <b id="sleepVal">5</b> 分钟</label>
          <input type="range" id="msSleep" min="1" max="15" value="5" oninput="sleepVal.textContent=this.value" style="width:100%">
          <div class="switch-row">
            <label><input type="checkbox" id="msAngle"> 直线修正</label>
            <label><input type="checkbox" id="msMotion" checked> Motion Sync</label>
            <label><input type="checkbox" id="msRipple"> Ripple Control</label>
            <label><input type="checkbox" id="msWakeup" checked> 移动唤醒</label>
          </div>
          <div class="btnrow">
            <button class="m3 primary" onclick="msApplyPerf()">下发性能</button>
            <button class="m3" onclick="msApplyPower()">下发电源</button>
          </div>
        </div>
      </div>
      <div id="msOther" class="hidden">
        <div class="card" style="margin:0">
          <h2>灯光</h2>
          <div style="display:flex;gap:10px">
            <select class="f" id="msLightMode" style="flex:1"></select>
            <input type="color" id="msLightColor" value="#409eff" style="width:50px;height:36px;padding:2px">
            <input class="f" type="number" id="msLightBri" min="1" max="4" value="4" style="width:60px" title="亮度 1-4">
            <input class="f" type="number" id="msLightSpd" min="1" max="3" value="3" style="width:60px" title="速度 1-3">
            <button class="m3 primary" onclick="msApplyLight()">应用</button>
          </div>
        </div>
        <div class="card">
          <h2>维护</h2>
          <div class="btnrow">
            <button class="m3" onclick="msFactoryReset()" style="color:var(--g-red)">恢复出厂设置</button>
          </div>
          <div id="msStateInfo" class="device-info" style="font-size:12px;color:var(--g-sub);margin-top:10px"></div>
        </div>
      </div>
    </div>
  </section>
</main>

<!-- drawers & menus -->
<div class="drawer-mask" id="drawerMask" onclick="closeDrawers()"></div>
<div class="drawer" id="pluginDrawer">
  <h3>插件管理 <button class="iconbtn" onclick="closeDrawers()"><svg><use href="#i-close"/></svg></button></h3>
  <div id="pluginList"></div>
</div>
<div class="drawer" id="logDrawer">
  <h3>通信日志 <button class="iconbtn" onclick="closeDrawers()"><svg><use href="#i-close"/></svg></button></h3>
  <pre class="mono" id="commLog">（空）</pre>
</div>
<div class="menu" id="presetMenu">
  <div class="mi" onclick="applyPreset('mac')"><svg><use href="#i-kb"/></svg>macOS 配列模式（Win/Alt 互换）</div>
  <div class="mi" onclick="applyPreset('game')"><svg><use href="#i-tune"/></svg>电竞游戏模式（禁用 LWin）</div>
  <div class="mi" onclick="applyPreset('win')"><svg><use href="#i-reset"/></svg>标准 Windows 默认模式</div>
</div>
<datalist id="usageList"></datalist>
<input type="file" id="importFile" accept=".json" style="display:none" onchange="importProfiles(event)">
<script src="app.js"></script>
</body>
</html>
